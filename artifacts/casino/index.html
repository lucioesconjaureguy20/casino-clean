    <!-- Unified scroll controller:
         1. Fixed pixel step per wheel notch (STEP px, always identical).
         2. Smooth easing animation via RAF — ticks stack on the target so
            rapid scrolling accumulates naturally.
         3. Correct routing: sidebar → sidebar <ul>, modal/panel → that container,
            page → <html>.
         4. is-scrolling class → pointer-events:none during scroll (hover jank fix). -->
    <script>
      (function(){
        var STEP   = 100;   // px per wheel notch
        var EASE   = 0.16;  // lerp factor per frame (lower = slower/smoother, 0.08-0.20)
        var _t;
        var root   = document.documentElement;

        /* ── Smooth scroll state (one target per scroll container) ── */
        var pageTgt = null;   // null = uninitialised (use live scrollTop on first tick)
        var pageCur = 0;
        var pageRaf = null;

        var sbTgt   = null;
        var sbCur   = 0;
        var sbRaf   = null;

        /* ── is-scrolling marker ──────────────────────────────────────────────
           Only triggered by real user input (wheel / touch), NOT by the scroll
           events that our own RAF loop fires when it sets scrollTop.
           This means pointer-events are re-enabled 200 ms after the user
           stops wheeling — cards become clickable again immediately.        */
        function mark(){
          root.classList.add('is-scrolling');
          clearTimeout(_t);
          _t = setTimeout(function(){ root.classList.remove('is-scrolling'); }, 200);
        }
        window.addEventListener('touchmove', mark, { passive:true });
        /* NOTE: intentionally NO scroll event → mark() here.
           Our RAF animation fires scroll events itself; listening to them
           would keep is-scrolling active for the entire animation duration
           and block all clicks on cards. */

        /* ── RAF loop for page ── */
        function animatePage(){
          var dist = pageTgt - pageCur;
          if (Math.abs(dist) < 0.6){
            pageCur = pageTgt;
            root.scrollTop = Math.round(pageTgt);
            pageRaf = null;
            return;
          }
          pageCur += dist * EASE;
          root.scrollTop = Math.round(pageCur);
          pageRaf = requestAnimationFrame(animatePage);
        }

        /* ── RAF loop for sidebar ── */
        function animateSidebar(ul){
          var dist = sbTgt - sbCur;
          if (Math.abs(dist) < 0.6){
            sbCur = sbTgt;
            ul.scrollTop = Math.round(sbTgt);
            sbRaf = null;
            return;
          }
          sbCur += dist * EASE;
          ul.scrollTop = Math.round(sbCur);
          sbRaf = requestAnimationFrame(function(){ animateSidebar(ul); });
        }

        /* ── Wheel handler ── */
        window.addEventListener('wheel', function(e){
          if (!e.deltaY) return;
          if (e.ctrlKey || e.metaKey) return;
          mark();
          e.preventDefault();

          var dir    = e.deltaY > 0 ? 1 : -1;
          var amount = dir * STEP;

          /* ① Sidebar — check first via contains() so the entire sidebar area
             (including the header/logo zone at the top) is captured regardless
             of how deep the target is in the DOM tree. */
          var sidebarEl = document.querySelector('.casino-sidebar');
          if (sidebarEl && sidebarEl.contains(e.target)) {
            var ul = sidebarEl.querySelector('ul');
            if (ul) {
              if (!sbRaf) { sbTgt = sbCur = ul.scrollTop; }
              sbTgt = Math.max(0, Math.min(sbTgt + amount, ul.scrollHeight - ul.clientHeight));
              if (!sbRaf) sbRaf = requestAnimationFrame(function(){ animateSidebar(ul); });
            }
            return; /* never fall through to page when cursor is inside sidebar */
          }

          /* Walk up from target (max 8 levels) to find the right scroll container.
             getComputedStyle is only called when scrollHeight > clientHeight (cheap guard first). */
          var el = e.target;
          var depth = 0;
          while (el && el !== root && depth < 8){
            depth++;

            /* (sidebar already handled above) */

            /* ② Other scrollable containers (modal, game panel) — instant scroll */
            if (el !== document.body && el.scrollHeight > el.clientHeight){
              var oy = getComputedStyle(el).overflowY;
              if (oy === 'scroll' || oy === 'auto'){
                var canScroll = dir > 0
                  ? el.scrollTop + el.clientHeight < el.scrollHeight - 1
                  : el.scrollTop > 0;
                if (canScroll){ el.scrollTop += amount; return; }
                break;   // at limit → fall through to page
              }
            }

            el = el.parentElement;
          }

          /* ③ Page — smooth.
             Only sync pageCur from DOM when animation is idle to avoid forced layout. */
          if (!pageRaf) { pageTgt = pageCur = root.scrollTop; }
          var maxScroll = root.scrollHeight - root.clientHeight;
          pageTgt = Math.max(0, Math.min(pageTgt + amount, maxScroll));
          if (!pageRaf) pageRaf = requestAnimationFrame(animatePage);

        }, { passive:false });
      })();
    </script>
