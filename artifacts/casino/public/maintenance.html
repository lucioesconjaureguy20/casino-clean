<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ManderBet — Under Maintenance</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #080d14;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 10%, rgba(212,175,55,0.10) 0%, transparent 70%),
        radial-gradient(ellipse 80% 60% at 50% 100%, rgba(26,100,200,0.07) 0%, transparent 70%);
      pointer-events: none;
    }

    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(212,175,55,0.15);
      animation: float linear infinite;
    }
    @keyframes float {
      0%   { transform: translateY(110vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.6; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    .card {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      padding: 56px 48px 48px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      backdrop-filter: blur(24px);
      max-width: 520px;
      width: 90%;
      text-align: center;
      box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(212,175,55,0.08) inset;
    }

    .logo {
      width: 200px;
      filter: drop-shadow(0 4px 24px rgba(212,175,55,0.30));
    }

    /* Icon */
    .icon-wrap {
      position: relative;
      width: 88px;
      height: 88px;
    }
    .icon-bg {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212,175,55,0.18) 0%, transparent 70%);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1);   opacity: 1; }
      50%       { transform: scale(1.18); opacity: 0.6; }
    }
    .icon-svg {
      position: relative;
      z-index: 1;
      width: 88px;
      height: 88px;
      filter: drop-shadow(0 0 14px rgba(212,175,55,0.45));
    }
    /* Sand stream animation inside the hourglass */
    @keyframes sandFall {
      0%   { opacity: 1;   transform: scaleY(1); }
      50%  { opacity: 0.6; transform: scaleY(0.4); }
      100% { opacity: 1;   transform: scaleY(1); }
    }
    .sand-stream { animation: sandFall 2.2s ease-in-out infinite; transform-origin: top center; }

    /* Text */
    .headline {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1.3;
      background: linear-gradient(135deg, #fff 30%, #d4af37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtext {
      font-size: 15px;
      font-weight: 400;
      color: #8fa8c8;
      line-height: 1.65;
      max-width: 380px;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212,175,55,0.35), transparent);
    }

    /* Status pill — no dot */
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(212,175,55,0.08);
      border: 1px solid rgba(212,175,55,0.20);
      border-radius: 999px;
      padding: 7px 22px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #d4af37;
    }

    /* Support email */
    .support {
      font-size: 13px;
      color: #8fa8c8;
    }
    .support a {
      color: #d4af37;
      text-decoration: none;
      font-weight: 600;
      transition: opacity .15s;
    }
    .support a:hover { opacity: 0.75; }

    .footer {
      position: fixed;
      bottom: 24px;
      font-size: 12px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.04em;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="particles" id="particles"></div>

  <div class="card">
    <img src="/mander-logo-maintenance.png" alt="ManderBet" class="logo" />

    <!-- Professional hourglass — static, no spin -->
    <div class="icon-wrap">
      <div class="icon-bg"></div>
      <svg class="icon-svg" viewBox="0 0 88 88" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#f5e070"/>
            <stop offset="100%" stop-color="#9a6f10"/>
          </linearGradient>
          <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"   stop-color="#f5e070"/>
            <stop offset="100%" stop-color="#c49a20"/>
          </linearGradient>
          <linearGradient id="sandTop" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="rgba(212,175,55,0.80)"/>
            <stop offset="100%" stop-color="rgba(212,175,55,0.20)"/>
          </linearGradient>
          <linearGradient id="sandBot" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="rgba(212,175,55,0.50)"/>
            <stop offset="100%" stop-color="rgba(212,175,55,0.90)"/>
          </linearGradient>
        </defs>

        <!-- Top bar -->
        <rect x="20" y="13" width="48" height="6" rx="3" fill="url(#goldH)"/>
        <!-- Bottom bar -->
        <rect x="20" y="69" width="48" height="6" rx="3" fill="url(#goldH)"/>

        <!-- Frame sides -->
        <line x1="24" y1="19" x2="44" y2="46" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="64" y1="19" x2="44" y2="46" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="24" y1="69" x2="44" y2="46" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="64" y1="69" x2="44" y2="46" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round"/>

        <!-- Upper sand (partially empty — about 60%) -->
        <path d="M31 22 Q44 22 57 22 L50 36 Q44 42 38 36 Z" fill="url(#sandTop)" opacity="0.85"/>

        <!-- Sand stream through neck -->
        <line class="sand-stream" x1="44" y1="44" x2="44" y2="52"
              stroke="rgba(212,175,55,0.7)" stroke-width="2" stroke-linecap="round"/>

        <!-- Lower sand pile (growing) -->
        <path d="M36 56 Q44 51 52 56 L58 66 Q44 66 30 66 Z" fill="url(#sandBot)" opacity="0.9"/>

        <!-- Neck pivot -->
        <circle cx="44" cy="46" r="3" fill="#d4af37"/>

        <!-- Decorative corner studs -->
        <circle cx="22" cy="16" r="2.5" fill="#f5e070" opacity="0.7"/>
        <circle cx="66" cy="16" r="2.5" fill="#f5e070" opacity="0.7"/>
        <circle cx="22" cy="72" r="2.5" fill="#f5e070" opacity="0.7"/>
        <circle cx="66" cy="72" r="2.5" fill="#f5e070" opacity="0.7"/>
      </svg>
    </div>

    <div class="headline">We're Under<br/>Maintenance</div>

    <p class="subtext">
      We'll be back shortly with an even better experience.<br/>
      Thank you for your patience.
    </p>

    <div class="divider"></div>

    <div class="status">Back online soon</div>

    <p class="support">
      Need help? Contact us at
      <a href="mailto:support@manderbet.com">support@manderbet.com</a>
    </p>
  </div>

  <p class="footer">&copy; ManderBet Casino &mdash; All rights reserved</p>

  <script>
    const container = document.getElementById('particles');
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 6 + 2;
      p.style.cssText = `
        width: ${size}px;
        height: ${size}px;
        left: ${Math.random() * 100}%;
        animation-duration: ${Math.random() * 14 + 10}s;
        animation-delay: ${Math.random() * -20}s;
        opacity: ${Math.random() * 0.4 + 0.1};
      `;
      container.appendChild(p);
    }
  </script>
</body>
</html>
